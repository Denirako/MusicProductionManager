{% extends 'projects/base.html' %}

{% block title %}Create Project | Music Production Manager{% endblock %}

{% block content %}
    <h1 class="display-5 fw-bold mb-4">Create New Project</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Project
        </button>
    </form>
{% endblock %}
